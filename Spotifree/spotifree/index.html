<!-- ══════════════════ SPLASH ══════════════════ -->
<div id="splash">
  <div class="splash-logo">
    <svg viewBox="0 0 24 24" width="54" height="54" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15V6"/><path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5"/><path d="M12 12H3"/><path d="M16 6H3"/><path d="M12 18H3"/></svg>
  </div>
  <div class="splash-name">SpotiFree</div>
  <div class="splash-tag">Free music. No login. No ads.</div>
  <div class="splash-bar"><i></i></div>
</div>

<!-- ══════════════════ APP ══════════════════ -->
<div id="app" hidden>

  <!-- ── Sidebar (desktop) ── -->
  <aside id="sidebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15V6"/><path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5"/><path d="M12 12H3"/><path d="M16 6H3"/><path d="M12 18H3"/></svg>
      <span>SpotiFree</span>
    </div>

    <nav class="side-nav">
      <button class="side-item" data-nav="home"><svg class="ic"><use href="#i-home"/></svg><span data-i18n="home">Home</span></button>
      <button class="side-item" data-nav="search"><svg class="ic"><use href="#i-search"/></svg><span data-i18n="search">Search</span></button>
      <button class="side-item" data-nav="library"><svg class="ic"><use href="#i-library"/></svg><span data-i18n="library">Library</span></button>
      <button class="side-item" id="navImport"><svg class="ic"><use href="#i-link"/></svg><span data-i18n="import">Import</span></button>
    </nav>

    <div class="side-sep"><span data-i18n="playlists">Playlists</span>
      <button class="icon-btn sm" id="btnNewPlaylist" title="New playlist"><svg class="ic"><use href="#i-plus"/></svg></button>
    </div>
    <div class="side-playlists" id="sidePlaylists"></div>

    <div class="side-foot">
      <button class="side-item" data-nav="settings"><svg class="ic"><use href="#i-settings"/></svg><span data-i18n="settings">Settings</span></button>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main id="main">
    <header id="topbar">
      <button class="icon-btn" id="btnBack" hidden><svg class="ic"><use href="#i-chev-left"/></svg></button>
      <div class="tb-title" id="tbTitle">Home</div>
      <div class="tb-actions" id="tbActions"></div>
    </header>

    <div id="scroller">
      <div id="ptr"><svg class="ic"><use href="#i-refresh"/></svg></div>
      <div id="view"></div>
      <div class="bottom-spacer"></div>
    </div>
  </main>

  <!-- ── Mini player ── -->
  <div id="mini" hidden>
    <div class="mini-progress"><i id="miniBar"></i></div>
    <button class="mini-art" id="miniArt" aria-label="Open player">
      <img id="miniImg" alt="" />
      <span class="mini-eq"><i></i><i></i><i></i></span>
    </button>
    <div class="mini-meta" id="miniMeta">
      <div class="mini-title" id="miniTitle">—</div>
      <div class="mini-sub" id="miniSub">—</div>
    </div>
    <div class="mini-ctrls">
      <button class="icon-btn" id="miniLike" aria-label="Like"><svg class="ic"><use href="#i-heart"/></svg></button>
      <button class="icon-btn" id="miniPrev" aria-label="Previous"><svg class="ic"><use href="#i-prev"/></svg></button>
      <button class="play-btn sm" id="miniPlay" aria-label="Play/Pause"><svg class="ic"><use href="#i-play"/></svg></button>
      <button class="icon-btn" id="miniNext" aria-label="Next"><svg class="ic"><use href="#i-next"/></svg></button>
    </div>
  </div>

  <!-- ── Bottom nav (mobile) ── -->
  <nav id="bottomnav">
    <button class="bn-item" data-nav="home"><svg class="ic"><use href="#i-home"/></svg><span data-i18n="home">Home</span></button>
    <button class="bn-item" data-nav="search"><svg class="ic"><use href="#i-search"/></svg><span data-i18n="search">Search</span></button>
    <button class="bn-item" data-nav="library"><svg class="ic"><use href="#i-library"/></svg><span data-i18n="library">Library</span></button>
    <button class="bn-item" data-nav="settings"><svg class="ic"><use href="#i-settings"/></svg><span data-i18n="settings">Settings</span></button>
  </nav>
</div>

<!-- ══════════════════ FULL PLAYER ══════════════════ -->
<div id="fullPlayer" class="overlay" hidden>
  <div class="fp-bg" id="fpBg"></div>
  <div class="fp-inner">
    <div class="fp-head">
      <button class="icon-btn" id="fpClose"><svg class="ic"><use href="#i-chev-down"/></svg></button>
      <div class="fp-head-txt">
        <div class="fp-from" id="fpFrom">Now playing</div>
        <div class="fp-title" id="fpTitle">—</div>
      </div>
      <button class="icon-btn" id="fpQueue"><svg class="ic"><use href="#i-library"/></svg></button>
    </div>

    <div class="fp-art-wrap" id="fpArtWrap">
      <img id="fpArt" alt="" />
    </div>

    <div class="fp-info">
      <div class="fp-song" id="fpSong">—</div>
      <div class="fp-channel" id="fpChannel">—</div>
    </div>

    <div class="fp-actions">
      <button class="icon-btn" id="fpDislike" title="Dislike"><svg class="ic"><use href="#i-ban"/></svg></button>
      <button class="icon-btn big" id="fpLike" title="Like"><svg class="ic"><use href="#i-heart"/></svg></button>
      <button class="icon-btn" id="fpAdd" title="Add to playlist"><svg class="ic"><use href="#i-list-plus"/></svg></button>
    </div>

    <div class="fp-seek">
      <input type="range" id="fpSeek" min="0" max="1000" value="0" step="1" aria-label="Seek" />
      <div class="fp-times"><span id="fpCur">0:00</span><span id="fpDur">0:00</span></div>
    </div>

    <div class="fp-controls">
      <button class="icon-btn" id="fpShuffle" title="Shuffle"><svg class="ic"><use href="#i-shuffle"/></svg></button>
      <button class="icon-btn xl" id="fpPrev" title="Previous"><svg class="ic"><use href="#i-prev"/></svg></button>
      <button class="play-btn xl" id="fpPlay" title="Play/Pause"><svg class="ic"><use href="#i-play"/></svg></button>
      <button class="icon-btn xl" id="fpNext" title="Next"><svg class="ic"><use href="#i-next"/></svg></button>
      <button class="icon-btn" id="fpRepeat" title="Repeat"><svg class="ic"><use href="#i-repeat"/></svg></button>
    </div>

    <div class="fp-extra">
      <button class="icon-btn" id="fpTimer" title="Sleep timer"><svg class="ic"><use href="#i-timer"/></svg></button>
      <div class="fp-vol">
        <button class="icon-btn" id="fpMute"><svg class="ic"><use href="#i-volume"/></svg></button>
        <input type="range" id="fpVol" min="0" max="100" value="80" aria-label="Volume" />
      </div>
      <button class="icon-btn" id="fpMini" title="Close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
  </div>
</div>

<!-- ══════════════════ QUEUE PANEL ══════════════════ -->
<div id="queuePanel" class="sheet" hidden>
  <div class="sheet-head">
    <div>
      <div class="sheet-title" data-i18n="queue">Queue</div>
      <div class="sheet-sub" id="qSub"></div>
    </div>
    <button class="icon-btn" id="qClose"><svg class="ic"><use href="#i-x"/></svg></button>
  </div>
  <div class="sheet-body" id="qBody"></div>
</div>

<!-- ══════════════════ GENERIC SHEET / MODAL ══════════════════ -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-head">
    <div class="sheet-title" id="sheetTitle">—</div>
    <button class="icon-btn" id="sheetClose"><svg class="ic"><use href="#i-x"/></svg></button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div id="scrim" hidden></div>

<!-- ══════════════════ TOASTS ══════════════════ -->
<div id="toasts"></div>

<!-- ══════════════════ HIDDEN YOUTUBE PLAYERS ══════════════════ -->
<div id="ytHost" aria-hidden="true">
  <div id="ytP0"></div>
  <div id="ytP1"></div>
</div>

<script src="https://www.youtube.com/iframe_api" async></script>
<script type="module" src="assets/js/app.js"></script>
<noscript><p style="padding:24px;font-family:sans-serif">SpotiFree needs JavaScript enabled.</p></noscript>
</body>
</html>
